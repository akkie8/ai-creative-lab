<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MISREGISTERED</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#ebe5d8}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="c" aria-label="MISREGISTERED — a twenty-second loop printed live in three inks. A Swiss poster slips out of register, dissolves into halftone, is stamped, cut and reset until everything aligns: PERFECT IS BORING."></canvas>
<script>
(() => {
'use strict';

// ═══════════════════════════════════════════════════════════════ context
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', {antialias: false, alpha: false, depth: false, stencil: false, premultipliedAlpha: false, powerPreference: 'high-performance'});
if (!gl) return;
cv.addEventListener('webglcontextlost', e => e.preventDefault());
cv.addEventListener('webglcontextrestored', () => location.reload());
let P3 = false;
try {
  if ('drawingBufferColorSpace' in gl && matchMedia('(color-gamut: p3)').matches) {
    gl.drawingBufferColorSpace = 'display-p3'; P3 = gl.drawingBufferColorSpace === 'display-p3';
  }
} catch (e) {}

// ═══════════════════════════════════════════════════════════════ math
const PI = Math.PI, TAU = PI * 2, D2R = PI / 180;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, x) => a + (b - a) * x;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const sm = x => x * x * (3 - 2 * x);
const fract = x => x - Math.floor(x);
const hash = n => fract(Math.sin(n * 127.1 + 311.7) * 43758.5453123);
const E = {
  lin: x => x,
  in2: x => x * x, out2: x => 1 - (1 - x) * (1 - x),
  in3: x => x * x * x, out3: x => 1 - (1 - x) ** 3, io3: x => x < .5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2,
  in4: x => x ** 4, out4: x => 1 - (1 - x) ** 4, io4: x => x < .5 ? 8 * x ** 4 : 1 - (-2 * x + 2) ** 4 / 2,
  inX: x => x <= 0 ? 0 : 2 ** (10 * x - 10), outX: x => x >= 1 ? 1 : 1 - 2 ** (-10 * x),
  ioX: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? 2 ** (20 * x - 10) / 2 : (2 - 2 ** (-20 * x + 10)) / 2,
  sm: sm, sm2: x => sm(sm(x)),
  back: x => { const c = 2.2; return 1 + (c + 1) * (x - 1) ** 3 + c * (x - 1) ** 2; },
  snap: x => 1 - (1 - x) ** 7,
  // lands with a small damped rebound: a plate hitting its stop
  hit: x => x >= 1 ? 1 : 1 - Math.exp(-7 * x) * Math.cos(x * 13) * (1 - x),
  step: x => x >= 1 ? 1 : 0,
};
// keyed tracks: [[t, v, ease], ...] — ease shapes the segment arriving at that key
function track(keys) {
  return t => {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      const k = keys[i];
      if (t < k[0]) { const a = keys[i - 1], x = (t - a[0]) / (k[0] - a[0]); return lerp(a[1], k[1], (E[k[2] || 'io3'])(x)); }
    }
    return keys[keys.length - 1][1];
  };
}
// damped impulse after time a: 0 at a, rings out
const ring = (t, a, f = 7, d = 7) => t < a ? 0 : Math.exp(-(t - a) * d) * Math.sin((t - a) * f * TAU);
const pulse = (t, a, d = 9) => t < a ? 0 : Math.exp(-(t - a) * d);

// 2D affine [a b c d e f]:  x' = a x + c y + e,  y' = b x + d y + f
const Mx = {
  mul: (m, n) => [m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1], m[0] * n[2] + m[2] * n[3], m[1] * n[2] + m[3] * n[3], m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5]],
  inv: m => { const d = m[0] * m[3] - m[1] * m[2]; return [m[3] / d, -m[1] / d, -m[2] / d, m[0] / d, (m[2] * m[5] - m[3] * m[4]) / d, (m[1] * m[4] - m[0] * m[5]) / d]; },
  T: (x, y) => [1, 0, 0, 1, x, y],
  S: (x, y = x) => [x, 0, 0, y, 0, 0],
  R: a => { const c = Math.cos(a), s = Math.sin(a); return [c, s, -s, c, 0, 0]; },
  gl: m => [m[0], m[1], 0, m[2], m[3], 0, m[4], m[5], 1],
};
const chain = (...ms) => ms.reduce((a, b) => Mx.mul(a, b));

// ═══════════════════════════════════════════════════════════════ type → signed distance atlas
const FD = '"Helvetica Neue", Helvetica, "Nimbus Sans", "Nimbus Sans L", FreeSans, Arial, "Liberation Sans", sans-serif';
const FM = '"SF Mono", Menlo, "IBM Plex Mono", Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace';
let ASCII = ''; for (let i = 32; i < 127; i++) ASCII += String.fromCharCode(i);
const FACES = {
  D: {css: `bold 224px ${FD}`, px: 224, sp: 30, chars: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.%'},
  S: {css: `500 46px ${FD}`, px: 46, sp: 6, chars: ASCII + '°×Δ±—·→↑−'},
  M: {css: `46px ${FM}`, px: 46, sp: 6, chars: ASCII + '°×Δ±—·→↑−'},
};
const AW = 2048;
function edt1(g, off, st, n, f, v, z) {
  v[0] = 0; z[0] = -1e20; z[1] = 1e20;
  for (let q = 0; q < n; q++) f[q] = g[off + q * st];
  for (let q = 1, k = 0, s = 0; q < n; q++) {
    do { const r = v[k]; s = (f[q] - f[r] + q * q - r * r) / (q - r) / 2; } while (s <= z[k] && --k > -1);
    k++; v[k] = q; z[k] = s; z[k + 1] = 1e20;
  }
  for (let q = 0, k = 0; q < n; q++) { while (z[k + 1] < q) k++; const r = v[k]; g[off + q * st] = f[r] + (q - r) * (q - r); }
}
function edt(g, w, h, f, v, z) { for (let x = 0; x < w; x++) edt1(g, x, w, h, f, v, z); for (let y = 0; y < h; y++) edt1(g, y * w, 1, w, f, v, z); }
function buildAtlas() {
  const mc = document.createElement('canvas').getContext('2d');
  let x = 0, y = 0, rowH = 0;
  const cells = [];
  for (const id in FACES) {
    const F = FACES[id]; F.g = {}; F.kc = new Map();
    mc.font = F.css;
    F.cap = mc.measureText('H').actualBoundingBoxAscent / F.px;
    F.mw = s => { mc.font = F.css; return mc.measureText(s).width / F.px; };
    const pad = F.sp + 2;
    for (const ch of F.chars) {
      const m = mc.measureText(ch);
      const L = Math.ceil(m.actualBoundingBoxLeft), R = Math.ceil(m.actualBoundingBoxRight), A = Math.ceil(m.actualBoundingBoxAscent), D = Math.ceil(m.actualBoundingBoxDescent);
      const w = Math.max(1, L + R) + pad * 2, h = Math.max(1, A + D) + pad * 2;
      if (x + w > AW) { x = 0; y += rowH + 2; rowH = 0; }
      cells.push({F, ch, x, y, w, h, ox: x + pad + L, oy: y + pad + A, adv: m.width / F.px, L, R, A, D, pad});
      x += w + 2; rowH = Math.max(rowH, h);
    }
    x = 0; y += rowH + 2; rowH = 0;
  }
  const AH = y;
  const c = document.createElement('canvas'); c.width = AW; c.height = AH;
  const cx = c.getContext('2d');
  cx.fillStyle = '#fff'; cx.textBaseline = 'alphabetic';
  for (const k of cells) { cx.font = k.F.css; cx.fillText(k.ch, k.ox, k.oy); }
  const src = cx.getImageData(0, 0, AW, AH).data, out = new Uint8Array(AW * AH);
  const mx = 420 * 420, go = new Float64Array(mx), gi = new Float64Array(mx), f = new Float64Array(512), v = new Uint16Array(512), z = new Float64Array(513);
  for (const k of cells) {
    const {w, h, F} = k, n = w * h;
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
      const a = src[((k.y + j) * AW + k.x + i) * 4 + 3] / 255, q = j * w + i;
      if (a >= 1) { go[q] = 0; gi[q] = 1e20; } else if (a <= 0) { go[q] = 1e20; gi[q] = 0; } else { const d = .5 - a; go[q] = d > 0 ? d * d : 0; gi[q] = d < 0 ? d * d : 0; }
    }
    edt(go, w, h, f, v, z); edt(gi, w, h, f, v, z);
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
      const q = j * w + i, d = Math.sqrt(go[q]) - Math.sqrt(gi[q]);
      out[(k.y + j) * AW + k.x + i] = Math.round(255 * clamp(.5 - d / (2 * F.sp)));
    }
    const px = F.px;
    F.g[k.ch] = {
      u0: k.x / AW, u1: (k.x + w) / AW, vt: k.y / AH, vb: (k.y + h) / AH,
      x0: (k.x - k.ox) / px, x1: (k.x + w - k.ox) / px, y1: (k.oy - k.y) / px, y0: (k.oy - k.y - h) / px,
      bl: -k.L / px, br: k.R / px, bt: k.A / px, bb: -k.D / px,
      adv: k.adv, ds: 2 * F.sp / px,
    };
  }
  return {data: out, w: AW, h: AH};
}
function kern(F, a, b) {
  if (!F.g[a] || !F.g[b]) return 0;
  const key = a + b; let k = F.kc.get(key);
  if (k === undefined) { k = F.mw(a + b) - F.g[a].adv - F.g[b].adv; if (Math.abs(k) < 1e-4) k = 0; F.kc.set(key, k); }
  return k;
}

// ═══════════════════════════════════════════════════════════════ GL
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function prog(vs, fs) {
  const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const a = gl.getActiveUniform(p, i), nm = a.name.replace(/\[0\]$/, ''); u[nm] = gl.getUniformLocation(p, a.name); }
  return {p, u};
}

// plate pass: every mark is an instanced quad written into its plate's channel
const PLATE_VS = `#version 300 es
layout(location=0) in vec2 aC;
layout(location=1) in vec4 iA;
layout(location=2) in vec4 iB;
layout(location=3) in vec4 iC;
layout(location=4) in vec4 iD;
layout(location=5) in vec4 iE;
layout(location=6) in vec4 iF;
layout(location=7) in vec4 iG;
uniform mat3 uM[3];
out vec2 vL; out vec2 vS; out vec2 vUV; out float vGr;
flat out vec4 fB; flat out vec4 fC; flat out vec4 fD; flat out vec4 fE; flat out vec4 fF; flat out vec4 fG;
void main() {
  vec2 p = iA.xy + iA.zw * aC.x + iB.xy * aC.y;
  vec3 c = uM[int(iB.z + .5)] * vec3(p, 1.);
  gl_Position = vec4(c.xy, 0., 1.);
  vL = aC * iE.xy; vS = p;
  vUV = mix(iF.xy, iF.zw, aC * .5 + .5);
  vGr = dot(aC, iG.zw) * .5 + .5;
  fB = iB; fC = iC; fD = iD; fE = iE; fF = iF; fG = iG;
}`;
const PLATE_FS = `#version 300 es
precision highp float;
uniform sampler2D uAtlas;
in vec2 vL; in vec2 vS; in vec2 vUV; in float vGr;
flat in vec4 fB; flat in vec4 fC; flat in vec4 fD; flat in vec4 fE; flat in vec4 fF; flat in vec4 fG;
layout(location=0) out vec4 o0;
layout(location=1) out vec4 o1;
void main() {
  int ty = int(fC.x + .5);
  float d;
  if (ty == 0) d = (texture(uAtlas, vUV).r - .5) * fE.z;
  else if (ty == 1) { vec2 q = abs(vL) - fF.xy + fF.z; d = -(length(max(q, 0.)) + min(max(q.x, q.y), 0.) - fF.z); }
  else { float r = length(vL); d = fF.x - r; if (fF.y > 0.) d = min(d, r - fF.y); }
  d += fC.w;
  float w = max(fwidth(d), fC.z);
  float cov = clamp(d / w + .5, 0., 1.);
  float v = cov * fC.y * mix(fG.x, fG.y, clamp(vGr, 0., 1.));
  if (v <= 0. || vS.x < fD.x || vS.y < fD.y || vS.x > fD.z || vS.y > fD.w) discard;
  int pl = int(fB.z + .5), md = int(fB.w + .5);
  vec4 ch = vec4(pl == 0 ? v : 0., pl == 1 ? v : 0., pl == 2 ? v : 0., 0.);
  o0 = md == 1 ? vec4(0.) : ch;
  o1 = md == 0 ? vec4(0.) : ch;
}`;

// print pass: each plate is screened, roughened and laid on paper as a translucent ink
const FULL_VS = `#version 300 es
void main() { vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); gl_Position = vec4(p * 2. - 1., 0., 1.); }`;
const PRINT_FS = `#version 300 es
precision highp float;
uniform sampler2D uTone, uLine, uNoise;
uniform vec2 uRes;
uniform mat3 uS2P[3], uP2S[3], uS2W;
uniform vec4 uScr[3], uInk[3];
uniform vec3 uT[3];
uniform vec3 uPaper;
uniform float uPx;
uniform int uP3;
out vec4 o;
const float PI = 3.14159265, TAU = 6.2831853;
vec4 N4(vec2 p) { return texture(uNoise, p * .00390625); }
float Nw(vec2 p) { return N4(p).r; }
float Ns(vec2 p) { return N4(p).g; }
float Nv(vec2 p) { return N4(p).b; }
float plate(int i, vec2 fc, vec2 uv) {
  vec4 S = uScr[i], I = uInk[i];
  vec2 pp = (uS2P[i] * vec3(fc, 1.)).xy;
  vec2 wv = (N4(pp * 5.3 + float(i) * 57.).gb * 1.6 + N4(pp * 19. + float(i) * 31.).ra * .8 - 1.2) * I.z / uPx / uRes;
  float tone = textureLod(uTone, uv + wv, 0.)[i];
  float ln = textureLod(uLine, uv + wv * .6, 0.)[i];
  float g = I.x;
  float ca = cos(S.y), sa = sin(S.y);
  vec2 q = mat2(ca, -sa, sa, ca) * pp / S.x;
  float cpx = S.x / uPx;
  float cov = 0.;
  if (S.w < .999) {
    // threshold screen: round dots → checkerboard → holes; morphs to a line screen
    float tg = clamp(tone + g * sin(PI * tone), 0., 1.);
    float th = mix(.5 - .25 * (cos(TAU * q.x) + cos(TAU * q.y)), .5 - .5 * cos(TAU * q.y), S.z);
    th = .012 + .976 * th;
    float e = tg - th;
    float a = clamp(e / max(fwidth(e), 1e-4) + .5, 0., 1.);
    a = mix(a, 1., smoothstep(.975, .995, tg)) * smoothstep(.002, .02, tg);
    cov = mix(tg, a, smoothstep(1.4, 3., cpx)) * (1. - S.w);
  }
  if (S.w > .001) {
    // amplitude screen: every cell prints one round dot sized by the ink it covers
    vec2 b = floor(q - .5) + .5;
    float lod = max(log2(cpx) - .3, 0.), fq = uPx / S.x, cb = 0.;
    for (int k = 0; k < 4; k++) {
      vec2 cc = b + vec2(float(k & 1), float(k >> 1));
      vec2 uc = (uP2S[i] * vec3(mat2(ca, sa, -sa, ca) * cc * S.x, 1.)).xy;
      float tc = textureLod(uTone, uc, lod)[i];
      float r = sqrt(tc / PI) * (1. + .28 * tc * tc * tc * tc) * (1. + g);
      cb = max(cb, clamp((r - length(q - cc)) / fq + .5, 0., 1.));
    }
    cov += cb * S.w;
  }
  return max(cov, ln);
}
void main() {
  vec2 fc = gl_FragCoord.xy, uv = fc / uRes;
  vec2 w = (uS2W * vec3(fc, 1.)).xy;
  // paper: short fibres in two directions, tooth, slow cloudiness, the odd fleck
  vec4 pa = N4(w * vec2(2.4, 7.2) + 3.);
  vec4 pb = N4(mat2(.5, .866, -.866, .5) * w * vec2(7.2, 2.4) + 91.);
  vec4 pc = N4(w * .21 + 33.);
  float tooth = N4(fc * .83 + 7.).r - .5;
  float fib = smoothstep(.6, .84, pa.g) * .6 + smoothstep(.6, .84, pb.g) * .4;
  float mot = pc.b + N4(w * .9 + 71.).b - 1.;
  vec3 col = uPaper * (1. - .024 * fib - .014 * tooth - .03 * mot);
  col *= 1. - .35 * smoothstep(.93, .97, pa.r) * smoothstep(.62, .72, pc.g);
  // inks: Beer–Lambert films, thinner where the roller starves and in the paper's valleys
  float pl = clamp(log2(max(uInk[0].z, .01) / uPx * 2.), 2., 5.);
  for (int i = 0; i < 3; i++) {
    if (uScr[i].w < .001 && textureLod(uTone, uv, pl)[i] + textureLod(uLine, uv, pl)[i] <= 0.) continue;
    float c = plate(i, fc, uv);
    if (c <= 0.) continue;
    float fi = float(i);
    vec4 nd = N4(w * .55 + fi * 19.), nv = N4(w * 4.1 + fi * 83.);
    float den = uInk[i].y * (1. + .2 * (nd.b - .5)) * (1. - .12 * fib) * (1. - .06 * tooth);
    den *= 1. - .85 * smoothstep(.91, .96, nv.r) * smoothstep(.5, .66, nd.g);
    col *= mix(vec3(1.), pow(uT[i], vec3(max(den, 0.))), clamp(c, 0., 1.));
  }

  col = clamp(col, 0., 1.);
  o = vec4(mix(col * 12.92, 1.055 * pow(col, vec3(1. / 2.4)) - .055, step(.0031308, col)), 1.);
}`;

const PL = prog(PLATE_VS, PLATE_FS), PR = prog(FULL_VS, PRINT_FS);

// atlas
const AT = buildAtlas();
const atlasTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, atlasTex);
gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, AT.w, AT.h, 0, gl.RED, gl.UNSIGNED_BYTE, AT.data);
gl.generateMipmap(gl.TEXTURE_2D);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

// paper & ink noise
const noiseTex = gl.createTexture();
{
  // r, a: white noise · g: soft (≈2 px) · b: very soft (≈6 px), all tileable
  const S = 256, A = S * S, n = new Uint8Array(A * 4); let s = 0x9e3779b9;
  const rnd = () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return (s >>> 0) / 4294967296; };
  const wn = [0, 1, 2, 3].map(() => { const f = new Float32Array(A); for (let i = 0; i < A; i++) f[i] = rnd(); return f; });
  const blur = (src, r, passes) => {
    let a = Float32Array.from(src), b = new Float32Array(A);
    for (let k = 0; k < passes; k++) for (let dir = 0; dir < 2; dir++) {
      for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
        let acc = 0;
        for (let d = -r; d <= r; d++) acc += dir ? a[((y + d + S) % S) * S + x] : a[y * S + (x + d + S) % S];
        b[y * S + x] = acc / (2 * r + 1);
      }
      [a, b] = [b, a];
    }
    let m = 0, v = 0; for (let i = 0; i < A; i++) m += a[i]; m /= A;
    for (let i = 0; i < A; i++) v += (a[i] - m) ** 2; v = Math.sqrt(v / A);
    for (let i = 0; i < A; i++) a[i] = clamp(.5 + (a[i] - m) / v * .17);
    return a;
  };
  const ch = [wn[0], blur(wn[1], 2, 3), blur(wn[2], 5, 3), wn[3]];
  for (let i = 0; i < A; i++) for (let c = 0; c < 4; c++) n[i * 4 + c] = Math.round(ch[c][i] * 255);
  gl.bindTexture(gl.TEXTURE_2D, noiseTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 256, 256, 0, gl.RGBA, gl.UNSIGNED_BYTE, n);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
}

// instances
const IF = 28, MAXI = 12000;
const ID = new Float32Array(MAXI * IF);
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
const qb = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, qb);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const ib = gl.createBuffer();

// ─────────── helpers

// ─────────── FORM: stamped, cut, compressed into a rule
function form(t) {

  const h = (top - bot) / N, keep = N > 1 ? 7 : 0;

    const ts = 9.45 + .016 * i + .01 * hash(i * 3.1);

    const tk = 9.8 + .012 * Math.abs(i - keep);
    const k = lerp(1, .035, E.io3(seg(t, tk, tk + .28)));
    const to = 10.02 + .016 * Math.abs(i - keep);
    if (i !== keep) dx += -300 * E.in3(seg(t, to, to + .36));

    for (const s of L.FORM) {

      if (showB) glyph('D', s.ch, x + 1.8, y - 1.8 * k, s.em * sl, {p: B, tone: .5, sy: L.syF * k, clip, soft: .3});
    }

// ─────────── burst + climax: rolls, screens, words, convergence
function burst(t) {

// convergence: every glyph of the final sentence rushes in on rails
const LAG = [1.45, 1, 1.22];

  const k = 1 - E.in2(seg(t, 12.9, 14.2)), dir = s.line === 1 ? -1 : 1, lag = LAG[p];
  const n = LY.P1[s.line].length, spread = (s.j - (n - 1) / 2) * 7 * k * lag;
  return {x: s.x + dir * (58 + 26 * s.line) * lag * k + spread, y: s.y};

// ─────────── P1: PERFECT IS BORING.  then the machine resets it
function slotsP1() { return [].concat(...LY.P1); }

      const dx = -84 * lg * k * (pl === B ? 1.15 : 1);
      rect(q.x0 + dx, q.y0, q.x1 + dx, q.y1, {p: pl});
    }

const MAP = [ // [p0 line, p0 index, p1 line, p1 index]  (−1 = printed fresh)

    const sp = splitAt(t, tw, ts + .3);

  });
  for (const [l1, i1] of EXIT) {
    const s = L.P1[l1][i1], tw = waveT(s.x, s.y), a = 1 - E.in2(seg(t, tw + .05, tw + .38));
    if (a <= 0) continue;

  }

  const tr = waveT(L.sqR.x0, L.sqR.y0), ar = 1 - E.in2(seg(t, tr + .05, tr + .38));
  if (ar > 0) rect(L.sqR.x0, L.sqR.y0, L.sqR.x1, L.sqR.y1, {p: R, tone: ar, soft: 2 * (1 - ar)});
  const t1 = SET0 + 9.5 * SETDT, a1 = E.out3(seg(t, t1, t1 + .3));
  if (a1 > 0) for (const s of L.n001) glyph('D', s.ch, s.x, s.y, s.em, {p: R, tone: a1, soft: 2.4 * (1 - a1)});
  const g1 = E.io4(seg(t, SET0, SET0 + .24)), g2 = E.io4(seg(t, SET0 + .2, SET0 + .46));

}
function tail(t) { // settled: the opening frame, exactly

  for (let i = 0; i < 3; i++) {
    const r = press.reg[i];
    const A = chain(Mx.T(r.px + r.x, r.py + r.y), Mx.R(r.r), Mx.S(r.s), Mx.T(-r.px, -r.py));
    const M = chain(clip, view, A);
    const s2p = Mx.inv(chain([W / 2, 0, 0, H / 2, W / 2, H / 2], M));
    const p2s = chain([.5, 0, 0, .5, .5, .5], M);
    out.push({M, s2p, p2s});
  }
  const s2w = Mx.inv(chain([W / 2, 0, 0, H / 2, W / 2, H / 2], clip, view));
  return {out, s2w};
}
function render(t) {
  resize();
  U = Math.min(H / 100, W / 160); VX = W / (2 * U); VY = H / (2 * U);
  TX = VX - 3.6; TY = Math.min(VY - 3.6, TX * .75);
  nI = 0; batches = []; curMode = -1;
  layouts();
  direct(t);
  PXS = 1 / (U * press.cam.z);
  compose(t);
  const {out, s2w} = planeMatrices();

  // plates
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.viewport(0, 0, W, H);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(PL.p);
  gl.uniformMatrix3fv(PL.u.uM, false, new Float32Array([].concat(...out.map(o => Mx.gl(o.M)))));
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, atlasTex); gl.uniform1i(PL.u.uAtlas, 0);
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, ib); gl.bufferSubData(gl.ARRAY_BUFFER, 0, ID, 0, nI * IF);
  gl.enable(gl.BLEND);
  for (const b of batches) {
    if (!b.n) continue;
    if (b.blend) { gl.blendEquation(gl.FUNC_ADD); gl.blendFunc(gl.ZERO, gl.ONE_MINUS_SRC_COLOR); }
    else gl.blendEquation(gl.MAX);
    for (let i = 1; i < 8; i++) gl.vertexAttribPointer(i, 4, gl.FLOAT, false, IF * 4, (b.start * IF + (i - 1) * 4) * 4);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, b.n);
  }
  gl.disable(gl.BLEND);
  gl.bindVertexArray(null);
  gl.bindTexture(gl.TEXTURE_2D, toneTex); gl.generateMipmap(gl.TEXTURE_2D);
  gl.bindTexture(gl.TEXTURE_2D, lineTex); gl.generateMipmap(gl.TEXTURE_2D);

  // print
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(PR.p);
  const u = PR.u;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, toneTex); gl.uniform1i(u.uTone, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, lineTex); gl.uniform1i(u.uLine, 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, noiseTex); gl.uniform1i(u.uNoise, 2);
  gl.uniform2f(u.uRes, W, H);
  gl.uniformMatrix3fv(u.uS2P, false, new Float32Array([].concat(...out.map(o => Mx.gl(o.s2p)))));
  gl.uniformMatrix3fv(u.uP2S, false, new Float32Array([].concat(...out.map(o => Mx.gl(o.p2s)))));
  gl.uniformMatrix3fv(u.uS2W, false, new Float32Array(Mx.gl(s2w)));
  gl.uniform4fv(u.uScr, new Float32Array([].concat(...press.scr.map(s => [s.c, s.a, s.m, s.b]))));
  gl.uniform4fv(u.uInk, new Float32Array([].concat(...press.ink.map(s => [s.g, s.d, s.r, 0]))));
  gl.uniform3fv(u.uT, new Float32Array([].concat(...TRANS)));
  gl.uniform3fv(u.uPaper, new Float32Array(PAPER));
  gl.uniform1f(u.uPx, PXS);
  gl.uniform1i(u.uP3, P3 ? 1 : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// ═══════════════════════════════════════════════════════════════ run
const fixedT = () => { const m = /t=([\d.]+)/.exec(location.hash); return m ? +m[1] : null; };
let t0 = null, acc = 0, cnt = 0, last = 0, held = null, warm = 90;
function loop(ts) {
  requestAnimationFrame(loop);
  if (t0 === null) t0 = ts;
  const el = (ts - t0) / 1000, fx = fixedT();
  const key = fx === null ? null : fx + '/' + innerWidth + 'x' + innerHeight;
  if (key !== null && key === held) return;
  held = key;
  const t = fx !== null ? fx % LOOP : el % LOOP;
  IMP = 417 + Math.floor((fx !== null ? fx : el) / LOOP + (t >= 14.2 ? 1 : 0));
  FRAME = Math.floor((fx !== null ? fx : el) * 60);
  const dt = ts - last; last = ts;
  // if the GPU keeps missing frames, print on a coarser plate (never below half resolution)
  if (fx === null && dt > 0 && dt < 120 && --warm < 0) {
    acc += dt; cnt++;
    if (cnt === 40) { if (acc / cnt > 22 && dprScale > .5) dprScale *= .85; acc = cnt = 0; }
  }
  render(t);
}
requestAnimationFrame(loop);
})();
</script>
