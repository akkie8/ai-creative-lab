<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moonlit Botanical Laboratory</title>
<style>
html,body{margin:0;height:100%;background:#06050d;overflow:hidden}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:crisp-edges;image-rendering:pixelated}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* ============ core ============ */
const H=270;let W=480,OX=0,XL=0,XR=480;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let _s=1;function srand(s){_s=s>>>0}
function rnd(){_s=_s+0x6D2B79F5|0;let t=Math.imul(_s^_s>>>15,1|_s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
const F=Math.floor,PI=Math.PI,sin=Math.sin,cos=Math.cos;
const ri=(a,b)=>a+F(rnd()*(b-a+1)),rf=(a,b)=>a+rnd()*(b-a),mr=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[F(rnd()*a.length)],mpick=a=>a[F(Math.random()*a.length)];
const BY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];const bay=(x,y)=>(BY[(y&3)*4+(x&3)]+.5)/16;
function hx(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function mix(a,b,t){const A=hx(a),B=hx(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);c.g=c.getContext('2d');c.g.imageSmoothingEnabled=false;return c}
function R(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(F(x),F(y),F(w),F(h))}
function P(g,x,y,c){g.fillStyle=c;g.fillRect(F(x),F(y),1,1)}
function circ(g,cx,cy,r,c){g.fillStyle=c;for(let dy=-r;dy<=r;dy++){const w=F(Math.sqrt(r*r-dy*dy)+.3);g.fillRect(F(cx-w),F(cy+dy),w*2+1,1)}}
function ell(g,cx,cy,rx,ry,c){g.fillStyle=c;for(let dy=-ry;dy<=ry;dy++){const w=F(rx*Math.sqrt(Math.max(0,1-(dy*dy)/(ry*ry)))+.3);g.fillRect(F(cx-w),F(cy+dy),w*2+1,1)}}
function ln(g,x0,y0,x1,y1,c){x0=F(x0);y0=F(y0);x1=F(x1);y1=F(y1);g.fillStyle=c;const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;for(let i=0;i<2000;i++){g.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
function dith(g,x,y,w,h,c,l){g.fillStyle=c;x=F(x);y=F(y);for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(bay(x+i,y+j)<l)g.fillRect(x+i,y+j,1,1)}
const nz=(t,s=0)=>sin(t*1.7+s*13.1)*.5+sin(t*2.93+s*7.3)*.3+sin(t*5.31+s*3.7)*.2;

/* ============ baked lighting ============ */
const AMB=[.25,.25,.42];
const LIGHTS=[
 {x:126,y:84,r:62,c:[1,.58,.26],s:1.1},      // shelf candle
 {x:154,y:38,r:74,c:[1,.6,.3],s:1.1},        // hanging lantern
 {x:152,y:158,r:62,c:[1,.58,.26],s:1.1},     // table candle
 {x:452,y:134,r:100,c:[1,.58,.28],s:1.45},   // desk candles
 {x:240,y:118,r:118,c:[.22,.85,.78],s:.95},  // terrarium teal
 {x:240,y:110,r:52,c:[.95,.3,.7],s:.55},     // heartbloom core
 {x:240,y:76,r:200,c:[.28,.4,.82],s:.75,sq:.8}, // moon window fill
 {x:38,y:226,r:58,c:[.28,.9,.72],s:.85},     // mushrooms
 {x:292,y:160,r:42,c:[.4,.95,.5],s:.6},      // alembic
 {x:78,y:84,r:46,c:[.45,.5,1],s:.65},        // potions
 {x:409,y:140,r:36,c:[.8,1,.3],s:.55},       // firefly jar
 {x:92,y:214,r:44,c:[.4,.6,1],s:.45},        // basin
];
function lightAt(x,y){let r=AMB[0],g=AMB[1],b=AMB[2];for(const L of LIGHTS){const dx=x-L.x,dy=(y-L.y)*(L.sq||1.1),d=Math.sqrt(dx*dx+dy*dy);if(d<L.r){const f=(1-d/L.r)**2*L.s;r+=L.c[0]*f;g+=L.c[1]*f;b+=L.c[2]*f}}return[r,g,b]}
// multiply albedo by banded, dithered light (world coords = pixel + ox/oy)
function bake(cn,ox,oy){const g=cn.g,w=cn.width,h=cn.height,id=g.getImageData(0,0,w,h),d=id.data;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;if(!d[i+3])continue;const wx=x+ox,wy=y+oy,L=lightAt(wx,wy),t=bay(wx,wy);
  for(let k=0;k<3;k++){const m=AMB[k]+F((L[k]-AMB[k])*12+t)/12;d[i+k]=Math.min(255,d[i+k]*m*1.05)}}
 g.putImageData(id,0,0)}
function lit(c,x,y){const A=hx(c),L=lightAt(x,y);return'rgb('+A.map((v,k)=>Math.min(255,Math.round(v*(AMB[k]+F((L[k]-AMB[k])*12+.5)/12)*1.05))).join(',')+')'}
function litS(fn,w,h,ox,oy){const c=mk(w,h);fn(c.g);bake(c,ox,oy);return c}

/* ============ glow sprites ============ */
const GC={};
function glow(r,col,pw=2){const k=r+col+pw;if(GC[k])return GC[k];const s=r*2,c=mk(s,s),id=c.g.createImageData(s,s),d=id.data,[cr,cg,cb]=hx(col);
 for(let y=0;y<s;y++)for(let x=0;x<s;x++){const dx=x-r+.5,dy=y-r+.5,q=Math.sqrt(dx*dx+dy*dy)/r;if(q>=1)continue;let v=Math.pow(1-q,pw);v=F(v*6+bay(x,y))/6;if(v<=0)continue;const i=(y*s+x)*4;d[i]=cr;d[i+1]=cg;d[i+2]=cb;d[i+3]=v*255}
 c.g.putImageData(id,0,0);return GC[k]=c}
function gl(x,y,r,col,a,pw){if(a<=.004)return;r=Math.max(2,Math.round(r));ctx.globalAlpha=Math.min(1,a);ctx.drawImage(glow(r,col,pw),Math.round(x-r),Math.round(y-r))}

/* draw sprite with row-shear (bending). pivotBottom: bottom rows fixed */
function shear(g,sp,x,y,amt,pivotBottom){const h=sp.height;let r0=0,o0=null;x=Math.round(x);y=Math.round(y);
 for(let r=0;r<=h;r++){let o=null;if(r<h){const f=pivotBottom?(h-1-r)/(h-1||1):r/(h-1||1);o=Math.round(amt*f*f)}
  if(o!==o0){if(o0!==null)g.drawImage(sp,0,r0,sp.width,r-r0,x+o0,y+r0,sp.width,r-r0);r0=r;o0=o}}}

/* ============ window geometry ============ */
const WCX=240,WCY=84,WRAD=64,WL=176,WRt=304,WT=20,WB=140;
const EX=176,EY=20,EW=129,EH=121;
const inWin=(x,y)=>y<=WB&&x>=WL&&x<=WRt&&(y>=WCY||(x-WCX)**2+(y-WCY)**2<=WRAD*WRAD);

/* ============ exterior world ============ */
const HZ=88; // local lake/horizon line inside window canvas
const MOON={lx:36,ly:28,r:10};MOON.x=EX+MOON.lx;MOON.y=EY+MOON.ly;
let SKY,LANDB,FOREST,STARS=[],CLOUDS=[],XFF=[],moonVis=1,moonT=1,shoots=[],skyThing=null;
const DLIGHTS=[{x:98,y:0,c:'#ffd27a',tower:1},{x:16,y:HZ-1,c:'#ffb45e'},{x:21,y:HZ-1,c:'#ffc676'},{x:62,y:HZ-2,c:'#ffb45e'},{x:118,y:HZ-1,c:'#ffcf80'}];
const yFar=x=>62+10*sin(x*.045+.6)+6*sin(x*.11+2)+3*sin(x*.27)-15*Math.exp(-(((x-84)/13)**2));
const yMid=x=>79+4*sin(x*.07+1)+3*sin(x*.19+.3);

function buildExterior(){
 srand(11);
 SKY=mk(EW,EH);let g=SKY.g;
 const cols=['#08071c','#0b0a24','#0f0f2e','#141638','#1a1d45','#212552','#2a2d5e','#352f66','#44356c','#553b70'];
 for(let y=0;y<EH;y++){const v=Math.min(1,Math.max(0,y-4)/(HZ-4))**1.3*(cols.length-1),i=F(v),f=v-i;
  for(let x=0;x<EW;x++)P(g,x,y,cols[f>bay(x,y)?Math.min(i+1,cols.length-1):i])}
 // milky way band
 for(let y=0;y<80;y++)for(let x=0;x<EW;x++){const d=Math.abs((x-(EW+10))*.62+(y+5)*.78-0)/1;const dd=Math.abs(x*0.62+y*0.78-72);if(dd<16){const p=(1-dd/16)**2;const r=rnd();
  if(r<p*.28)P(g,x,y,'#262d68');else if(r<p*.34)P(g,x,y,'#3a4590');else if(r<p*.36)P(g,x,y,'#8e9ad8')}}
 // moon halo
 const mx=MOON.lx,my=MOON.ly;
 for(let y=my-30;y<=my+30;y++)for(let x=mx-30;x<=mx+30;x++){const d=Math.hypot(x-mx,y-my);if(d>10&&d<30){const l=(1-(d-10)/20)**1.6;if(bay(x,y)<l*.75)P(g,x,y,d<16?'#4a5498':'#303a78')}}
 // moon disc
 for(let y=-MOON.r;y<=MOON.r;y++)for(let x=-MOON.r;x<=MOON.r;x++){const d=Math.hypot(x,y);if(d>MOON.r+.2)continue;
  let c='#ece2c2';if(x+y>7)c='#cdbf98';else if(x+y>4&&bay(x,y)<.5)c='#d9cda6';else if(x+y<-8)c='#fffbea';P(g,mx+x,my+y,c)}
 for(const [cx,cy,r] of [[-3,2,2],[3,-3,1],[2,4,2],[-5,-3,1],[5,1,1]])ell(g,mx+cx,my+cy,r,r*.8|0||1,'#cbbd93');
 P(g,mx-4,my-6,'#fff');P(g,mx-6,my-4,'#fff');

 // landscape: mountains, hills, lake
 LANDB=mk(EW,EH);g=LANDB.g;
 for(let x=0;x<EW;x++){const y0=F(yFar(x)),face=yFar(x)-yFar(x-1)<0;
  R(g,x,y0,1,HZ+2-y0,'#252b5a');for(let k=0;k<4;k++){if(face&&bay(x,y0+k)<1-k*.28)P(g,x,y0+k,'#39468a')}
  if(y0<58){P(g,x,y0,'#a6b0e0');if(face||bay(x,y0)<.5)P(g,x,y0+1,'#7d88c4')}}
 for(let x=0;x<EW;x++){const y0=F(yMid(x));R(g,x,y0,1,HZ+2-y0,'#181d40');P(g,x,y0,'#2a3364');if(yMid(x)-yMid(x-1)<0)P(g,x,y0+1,'#222a58')}
 // tower on the hill
 const tb=F(yMid(98));DLIGHTS[0].y=tb-9;
 R(g,96,tb-14,5,14,'#10142e');R(g,95,tb-15,7,2,'#10142e');for(let k=0;k<5;k++)R(g,98-F(k/2),tb-20+k,1+F(k/2)*2,1,'#10142e');P(g,98,tb-21,'#10142e');P(g,96,tb-13,'#232a58');
 // lake
 for(let y=HZ;y<HZ+16;y++)for(let x=0;x<EW;x++){let c=(y-HZ)%3===0&&bay(x,y)<.5?'#252c64':'#1b2152';const rh=(HZ-yMid(x))*.55;if(y-HZ<rh&&bay(x,y)<.6)c='#131838';P(g,x,y,c)}
 R(g,0,HZ,EW,1,'#2c3672');
 // forest
 FOREST=mk(EW,EH);g=FOREST.g;
 const pine=(x,b,h,c,rim)=>{for(let j=0;j<h;j++){const hw=F(j*.3+(j%5)*.5*(j/h));R(g,x-hw,b-h+j,hw*2+1,1,c);if(bay(x,j)<.7)P(g,x-hw,b-h+j,rim)}R(g,x,b,1,3,c)};
 for(let x=-3;x<EW+4;x+=ri(4,7))pine(x,ri(98,103),ri(9,16),'#111a34','#23315e');
 for(let x=-4;x<EW+6;x+=ri(6,10))pine(x,ri(106,113),ri(16,30),'#080d1c','#1a2650');
 R(g,0,110,EW,EH-110,'#070b17');
 // stars
 srand(21);STARS=[];
 for(let i=0;i<95;i++){const x=ri(0,EW-1),y=F(rnd()**1.3*80);if(Math.hypot(x-mx,y-my)<16){i--;continue}
  STARS.push({x,y,b:rf(.25,1),big:rnd()<.12,f:rf(.4,2.6),ph:rf(0,6.3),c:pick(['#dfe6ff','#ffe9c8','#c8d8ff','#ffffff'])})}
 // clouds
 srand(33);CLOUDS=[];for(let i=0;i<5;i++)CLOUDS.push(mkCloud(rf(-30,EW),rf(6,62)));
 XFF=[];for(let i=0;i<13;i++)XFF.push({x:rf(0,EW),y:rf(86,118),ph:rf(0,9),sp:rf(.6,1.6),s:rf(0,50)});
}
function mkCloud(x,y){const w=ri(34,66),h=ri(9,14),c=mk(w,h),g=c.g,bl=[];const n=ri(4,7);
 for(let i=0;i<n;i++)bl.push([rf(6,w-6),rf(h*.45,h*.7),rf(4,Math.min(12,w/4)),rf(2.5,h*.45)]);
 const m=(x,y)=>bl.some(b=>((x-b[0])/b[2])**2+((y-b[1])/b[3])**2<1);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(!m(x,y))continue;let edge=0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1],[2,0],[-2,0]])if(!m(x+dx,y+dy))edge++;
  if(edge>1&&bay(x,y)<.5)continue;const c2=!m(x,y-2)?'#7a80b6':!m(x,y+2)?'#22275a':((x+y)%2&&!m(x,y-4))?'#50578e':'#343a6e';P(g,x,y,c2)}
 return{sp:c,x,y,w,h,v:rf(.5,1.4)}}

function drawExterior(T,dt){
 ctx.drawImage(SKY,EX,EY);
 // stars
 for(const s of STARS){const lv=s.b*(.62+.38*sin(T*s.f+s.ph));if(lv<.18)continue;const c=lv>.78?s.c:lv>.48?'#8f98d0':'#4d5590';
  P(ctx,EX+s.x,EY+s.y,c);if(s.big&&lv>.8){ctx.fillStyle='#6a74b4';ctx.fillRect(EX+s.x-1,EY+s.y,1,1);ctx.fillRect(EX+s.x+1,EY+s.y,1,1);ctx.fillRect(EX+s.x,EY+s.y-1,1,1);ctx.fillRect(EX+s.x,EY+s.y+1,1,1)}}
 // shooting stars
 for(let i=shoots.length-1;i>=0;i--){const s=shoots[i];s.t+=dt;if(s.t>s.max){shoots.splice(i,1);continue}
  const k=s.t/s.max,hx0=s.x+s.vx*s.t,hy0=s.y+s.vy*s.t;
  for(let j=0;j<14;j++){const f=j/14,px=hx0-s.vx*f*.12,py=hy0-s.vy*f*.12;if(j>0&&bay(F(px),F(py))<f*.8)continue;P(ctx,EX+px,EY+py,j<2?'#ffffff':j<6?'#cfe0ff':'#6f7cc0')}
  ctx.globalCompositeOperation='lighter';gl(EX+hx0,EY+hy0,5,'#8090ff',.5*(1-k));ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1}
 // sky whale (rare)
 if(skyThing&&skyThing.type==='whale')drawWhale(T,dt);
 // moon glow reacts to clouds
 let occ=0;for(const c of CLOUDS){const fx=cl(Math.min(MOON.lx-c.x,c.x+c.w-MOON.lx)/(c.w*.3),0,1),fy=cl(Math.min(MOON.ly-c.y,c.y+c.h-MOON.ly)/(c.h*.35),0,1);occ+=fx*fy*.8}
 moonT=1-Math.min(.72,occ);moonVis+=(moonT-moonVis)*Math.min(1,dt*1.5);
 ctx.globalCompositeOperation='lighter';gl(MOON.x,MOON.y,26,'#4a58b0',.35*moonVis,1.6);gl(MOON.x,MOON.y,13,'#9098d8',.25*moonVis);ctx.globalCompositeOperation='source-over';
 // clouds
 ctx.globalAlpha=.9;for(const c of CLOUDS){c.x-=c.v*dt;if(c.x+c.w<-4){c.x=EW+rf(5,70);c.y=mr(6,62)}ctx.drawImage(c.sp,Math.round(EX+c.x),Math.round(EY+c.y))}ctx.globalAlpha=1;
 ctx.drawImage(LANDB,EX,EY);
 // lake shimmer under moon
 for(let y=HZ+1;y<HZ+15;y++){const k=y-HZ,hw=1+k*.5,wob=sin(T*.9+y*.7)*1.5;
  for(let dx=-hw;dx<=hw;dx++){const v=sin(T*2.1+y*1.9+dx*.8)+sin(T*1.25-dx*.55+y*1.1);if(v>.7-(1-moonVis)*.8)continue;if(v>-.2)continue;
   P(ctx,EX+MOON.lx+dx+wob,EY+y,k<6&&v<-1.2?'#e8e8ff':'#9aa2d8')}}
 for(let i=0;i<4;i++){const gx=(i*37+F(T*.5+i*9)*23)%EW,gy=HZ+2+(i*5+F(T*.3+i))%12;if(sin(T*3+i*7)>.8)P(ctx,EX+gx,EY+gy,'#6f7ac0')}
 // distant lights
 for(const d of DLIGHTS){let on=.8+.2*sin(T*(d.tower?.7:3.3)+d.x);if(d.tower&&sin(T*.05)>.93)on=0;if(on<.3)continue;
  P(ctx,EX+d.x,EY+d.y,d.c);ctx.globalCompositeOperation='lighter';gl(EX+d.x,EY+d.y+.5,3,'#ff9a40',.35*on);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  if(!d.tower)P(ctx,EX+d.x,EY+HZ+2+(d.x%3),'#6a5a60')}
 if(skyThing&&skyThing.type==='deer')drawDeer(T,dt);
 ctx.drawImage(FOREST,EX,EY);
 // exterior fireflies
 ctx.globalCompositeOperation='lighter';
 for(const f of XFF){const b=sin(T*f.sp+f.ph);if(b<.35)continue;const x=EX+f.x+nz(T*.15,f.s)*9,y=EY+f.y+nz(T*.2,f.s+3)*4;P(ctx,x,y,'#e8ff9a');gl(x,y,3,'#90ff40',.45*(b-.35))}
 ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
 if(skyThing&&skyThing.type==='owl')drawOwl(T,dt);
}

/* --- outside silhouettes --- */
let WHALE;
function buildWhale(){WHALE=mk(42,14);const g=WHALE.g,c='#04061a';ell(g,15,6,14,5,c);for(let x=28;x<37;x++){const t=(x-28)/9;R(g,x,5+t*1.2,1,Math.max(1,4-t*3),c)}
 for(let k=0;k<5;k++){R(g,36+k,6-k*1.1,1,1+k*.4,c);R(g,36+k,7+k*.6,1,1+k*.3,c)}R(g,12,10,5,2,c);R(g,15,12,3,1,c);R(g,2,7,4,1,'#151a3e');}
function drawWhale(T,dt){const s=skyThing;s.t+=dt;const x=EX+EW+12-s.t*3.4,y=EY+s.y+sin(s.t*.35)*3;if(x<EX-50){skyThing=null;return}
 ctx.globalAlpha=.88;ctx.drawImage(WHALE,Math.round(x),Math.round(y));ctx.globalAlpha=1;ctx.globalCompositeOperation='lighter';
 for(let i=0;i<6;i++){const b=.5+.5*sin(T*2-i*.9);P(ctx,x+5+i*4,y+8,b>.5?'#8ff0ff':'#3a7aa0');gl(x+5+i*4,y+8,3,'#40c0ff',.3*b)}
 ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1}
function drawOwl(T,dt){const s=skyThing;s.t+=dt;const x=EX-8+s.t*34,y=EY+s.y+sin(s.t*3)*3+s.t*2;if(x>EX+EW+10){skyThing=null;return}
 const up=F(s.t*7)%2,c='#05070f';R(ctx,x,y,3,2,c);P(ctx,x+3,y,c);
 if(up){ln(ctx,x-1,y,x-4,y-2,c);ln(ctx,x+2,y,x+5,y-3,c)}else{ln(ctx,x-1,y+1,x-4,y+2,c);ln(ctx,x+2,y+1,x+5,y+3,c)}}
function drawDeer(T,dt){const s=skyThing;s.t+=dt;const x=Math.round(EX-10+s.t*4.2),fy=EY+HZ-1;if(x>EX+EW+10){skyThing=null;return}
 const c='#080b1e',step=F(s.t*3)%2;
 // body/legs/neck
 R(ctx,x,fy-5,6,2,c);R(ctx,x+5,fy-8,1,3,c);R(ctx,x+5,fy-9,2,1,c);R(ctx,x+(step?0:1),fy-3,1,3,c);R(ctx,x+(step?5:4),fy-3,1,3,c);
 ctx.globalCompositeOperation='lighter';

 const c=d<22?'#f4e4c4':'#9a8a78';P(ctx,m.x,m.y,c);if(fl){R(ctx,m.x-2,m.y-1,2,1,c);R(ctx,m.x+1,m.y-1,2,1,c)}else{R(ctx,m.x-2,m.y,2,1,c);R(ctx,m.x+1,m.y,2,1,c)}}

const SPIRIT={on:0};
const SPOTS=[{x:240,y:72,k:'terr'},{x:111,y:36,k:'shelf'},{x:84,y:198,k:'lotus'},{x:196,y:116,k:'watch'},{x:438,y:76,k:'pothos'},{x:34,y:206,k:'mush'},{x:404,y:118,k:'jar'},{x:300,y:128,k:'alem'}];
function spawnSpirit(){if(SPIRIT.on)return;const s=mpick(SPOTS);Object.assign(SPIRIT,{on:1,x:s.x,y:s.y,bx:s.x,by:s.y,t:0,dur:mr(5,9),k:s.k,vx:mr(-2.5,2.5),a:0});
 CS.until=T+SPIRIT.dur+.8;CS.ear=.5;for(let k=0;k<8;k++)spawn('spark',s.x,s.y,mr(-10,10),mr(-10,6),mr(.5,1),'#c0fff0');
 if(s.k==='terr')TP.boost=1;if(s.k==='mush')MUSH.forEach(m=>puff(m,3));if(s.k==='watch'){EYE.until=T+6;EYE.lx=-1}if(s.k==='lotus')BASIN.rip.push({x:82,y:211,r:1,l:1})}
function drawSpirit(dt){const s=SPIRIT;if(!s.on)return;s.t+=dt;const a=s.t<.8?s.t/.8:s.t>s.dur-.6?(s.dur-s.t)/.6:1;s.a=Math.max(0,a);
 s.x=s.bx+sin(s.t*.7)*6+s.vx*s.t;s.y=s.by+sin(s.t*2.1)*2-s.t*.8;CS.tx=s.x;CS.ty=s.y;
 if(s.t>s.dur){s.on=0;for(let k=0;k<12;k++)spawn('spark',s.x,s.y,mr(-14,14),mr(-14,8),mr(.4,1),'#c0fff0');if(s.k==='terr'&&Math.random()<.6)later(.4,()=>{TP.flare=1;flareSparks()});return}
 ctx.globalAlpha=s.a;const x=Math.round(s.x),y=Math.round(s.y);
 R(ctx,x-2,y-2,5,4,'#dcfff6');R(ctx,x-1,y-3,3,1,'#dcfff6');R(ctx,x-1,y+2,3,1,'#a8f0e0');P(ctx,x+Math.round(sin(s.t*3)),y+3,'#78d8c8');
 if(sin(s.t*4)<.9){P(ctx,x-1,y-1,'#1a4040');P(ctx,x+1,y-1,'#1a4040')}P(ctx,x-2,y,'#ffc0dc');P(ctx,x+2,y,'#ffc0dc');ctx.globalAlpha=1}
function lightSpirit(){const s=SPIRIT;if(!s.on)return;gl(s.x,s.y,16,'#50ffd0',.3*s.a,1.5);gl(s.x,s.y,4,'#ffffff',.35*s.a)}

const MOUSE={on:0};
function startMouse(){if(MOUSE.on)return;Object.assign(MOUSE,{on:1,x:137,px:mr(70,110),pause:0,done:0});CS.ear=1.2;if(Math.random()<.5)later(.8,()=>{CS.until=T+2.8;CS.tx=90;CS.ty=130})}
function drawMouse(dt){const m=MOUSE;if(!m.on)return;const sniff=!m.done&&m.x<m.px;if(sniff){m.pause+=dt;if(m.pause>1.6)m.done=1}else m.x-=dt*40;if(m.x<33){m.on=0;return}
 const x=Math.round(m.x),y=133,c=lit('#8a8298',100,128),f=F(T*16)%2;if(x>136)return;
 R(ctx,x,y-2,4,2,c);R(ctx,x-2,y-2-(sniff&&sin(T*20)>0?1:0),2,2,c);P(ctx,x-1,y-3,lit('#e0a0b0',100,128));P(ctx,x-2,y-2,'#101010');
 if(!sniff){P(ctx,x+(f?0:1),y,c);P(ctx,x+(f?3:2),y,c)}ln(ctx,x+4,y-1,x+7,y-2+Math.round(sin(T*9)),c)}

/* ============ events ============ */
const LATER=[];function later(d,f){LATER.push({t:T+d,f})}
function flareSparks(){for(let k=0;k<18;k++){const a=mr(0,6.28),v=mr(6,18);spawn('spark',TP.fx,TP.fy,cos(a)*v,sin(a)*v-4,mr(.8,1.8),Math.random()<.5?'#ffc0e8':'#b8fff0')}CS.until=Math.max(CS.until,T+3);CS.tx=240;CS.ty=100}
const EVENTS=[
 {a:22,b:65,first:[5,12],f:()=>shoots.push({x:mr(50,EW),y:mr(0,22),vx:-mr(70,120),vy:mr(22,45),t:0,max:mr(.7,1.2)})},
 {a:40,b:95,first:[16,26],f:()=>{TP.flare=1;flareSparks()}},
 {a:38,b:100,first:[24,40],f:spawnSpirit},
 {a:14,b:40,first:[7,14],f:()=>{const s=mpick(BST);s.flash=1;s.boil=1.2}},
 {a:24,b:65,first:[10,18],f:()=>{EYE.until=T+mr(3,6);EYE.lx=mpick([-1,0,1])}},
 {a:45,b:110,first:[32,50],f:()=>{CS.until=T+mr(2.5,4.5);const t=mpick([[240,70],[154,40],[300,100],[404,130]]);CS.tx=t[0];CS.ty=t[1]}},
 {a:40,b:110,first:[18,34],f:()=>{if(skyThing)return;const r=Math.random();skyThing=r<.42?{type:'owl',t:0,y:mr(16,50)}:r<.72?{type:'deer',t:0}:{type:'whale',t:0,y:mr(26,42)}}},
 {a:30,b:80,first:[14,24],f:()=>MUSH.forEach(m=>puff(m,9))},
 {a:26,b:70,first:[9,17],f:()=>{RUNE.t=T;TP.boost=1;if(Math.random()<.35)later(1.8,()=>{TP.flare=1;flareSparks()})}},
 {a:55,b:140,first:[30,55],f:startMouse},
 {a:24,b:60,first:[12,28],f:()=>{GUST=1;LANT.v+=mr(.25,.45)*mpick([-1,1])}},
 {a:6,b:14,f:()=>{CS.tailT=T}},
 {a:18,b:38,first:[6,11],f:()=>{BOOK.t=T;BOOK.sp=0}},
 {a:9,b:18,f:()=>puff(mpick(MUSH),5)},
 {a:30,b:70,first:[10,22],f:startMoth},
 {a:5,b:12,f:()=>BASIN.rip.push({x:mr(70,114),y:mr(210,214),r:1,l:1})},
];
EVENTS.forEach(e=>e.next=e.first?mr(...e.first):mr(e.a,e.b));
function updEvents(dt){for(const e of EVENTS)if(T>=e.next){e.f();e.next=T+mr(e.a,e.b)}
 for(let i=LATER.length-1;i>=0;i--)if(T>=LATER[i].t){const l=LATER.splice(i,1)[0];l.f()}
 GUST=Math.max(0,GUST-dt*.3);WIND=nz(T*.11,1)*.5+GUST*(.8+.3*sin(T*3))}

/* ============ main loop ============ */
let last=0;
function frame(now){requestAnimationFrame(frame);if(!ROOM)return;if(!last)last=now;let dt=(now-last)/1000;if(dt<1/31)return;last=now;dt=Math.min(dt,.1);T+=dt;
 updEvents(dt);updParts(dt);
 ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.fillStyle='#06050d';ctx.fillRect(0,0,W,H);ctx.setTransform(1,0,0,1,OX,0);
 drawExterior(T,dt);
 ctx.drawImage(ROOM,-OX,0);
 ctx.globalCompositeOperation='lighter';ctx.globalAlpha=cl(moonVis*(.78+.22*nz(T*.13,4)),0,1);ctx.drawImage(BEAM,-OX,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 drawMotes(dt);
 drawBottles(T,dt);drawSill(T,dt);drawAlembic(T,dt);drawBook(T);drawBasin(T,dt);drawMush(T,dt);drawJar(T);
 drawTerrarium(T,dt);drawCat(T,dt);drawFlames(T);drawHanging(T);drawLantern(T,dt);
 drawMouse(dt);drawMoth(dt);drawSpirit(dt);drawBugs(dt);drawParts();
 ctx.globalCompositeOperation='lighter';
 lightFlames(T);lightLantern(T);lightBottles(T);lightAlembic(T);lightBasin(T);lightMush(T);lightJar(T);lightTerrarium(T);lightCat();lightParts();lightSpirit();lightBugs();
 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 for(const f of FG)shear(ctx,f.sp,f.x(),f.y,f.amp*(sin(T*.5+f.s)*.6+WIND*1.3),f.pivot);
 ctx.drawImage(VIGN,-OX,0);
}
function build(){buildExterior();buildWhale();buildRoom();buildProps()}
function resize(){const a=innerWidth/innerHeight;W=cl(Math.round(H*a),420,640);OX=F((W-480)/2);XL=-OX;XR=W-OX;
 cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;const s=Math.max(innerWidth/W,innerHeight/H);cv.style.width=Math.ceil(W*s)+'px';cv.style.height=Math.ceil(H*s)+'px';build()}
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(resize,200)});
resize();requestAnimationFrame(frame);
