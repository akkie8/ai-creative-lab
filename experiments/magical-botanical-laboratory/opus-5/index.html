<!DOCTYPE html>

<title>The Moonlit Herbarium</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#04060c;overflow:hidden;}
  canvas{display:block;width:100vw;height:100vh;object-fit:cover;image-rendering:pixelated;image-rendering:crisp-edges;-ms-interpolation-mode:nearest-neighbor;}
  @media (max-aspect-ratio: 3/2){canvas{object-fit:contain;}}
  @media (min-aspect-ratio: 2/1){canvas{object-fit:contain;}}
</style>

<body>
<canvas id="c" width="480" height="270"></canvas>
<script>
(function(){
"use strict";
var W=480,H=270;
var view=document.getElementById('c');
var VX=view.getContext('2d');
VX.imageSmoothingEnabled=false;

function mk(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;var g=c.getContext('2d');g.imageSmoothingEnabled=false;return {c:c,g:g};}
var SC=mk(W,H), S=SC.g;            // scene
var BG=mk(W,H), B=BG.g;            // baked interior (window opening transparent)
var LT=mk(W,H), L=LT.g;            // lightmap
var GL=mk(W,H), G=GL.g;            // pure glow

/* ---------------- primitives ---------------- */
var BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function bay(x,y){return BAY[(((y|0)&3)<<2)|((x|0)&3)]/16;}
function px(g,x,y,c){g.fillStyle=c;g.fillRect(x|0,y|0,1,1);}
function rect(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function hl(g,x,y,w,c){rect(g,x,y,w,1,c);}
function vl(g,x,y,h,c){rect(g,x,y,1,h,c);}
function circ(g,cx,cy,r,c){g.fillStyle=c;for(var dy=-r;dy<=r;dy++){var v=r*r-dy*dy;if(v<0)continue;var d=Math.floor(Math.sqrt(v));g.fillRect(Math.round(cx-d),Math.round(cy+dy),2*d+1,1);}}
function ell(g,cx,cy,rx,ry,c){g.fillStyle=c;for(var dy=-ry;dy<=ry;dy++){var t=1-(dy*dy)/(ry*ry);if(t<0)continue;var d=Math.floor(rx*Math.sqrt(t));g.fillRect(Math.round(cx-d),Math.round(cy+dy),2*d+1,1);}}
function ringd(g,cx,cy,r,c){for(var a=0;a<Math.PI*2;a+=0.06){px(g,cx+Math.cos(a)*r,cy+Math.sin(a)*r,c);}}
function dith(g,x,y,w,h,c1,c2,t){for(var j=0;j<h;j++)for(var i=0;i<w;i++){px(g,x+i,y+j,bay(x+i,y+j)<t?c2:c1);}}
function rgba(r,g2,b,a){return 'rgba('+(r|0)+','+(g2|0)+','+(b|0)+','+a+')';}

/* seeded rng for the bake */
var seed=20260924;
function rr(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
function rs(a,b){return a+rr()*(b-a);}
function ri(a,b){return Math.floor(a+rr()*(b-a+1));}
function pick(a){return a[ri(0,a.length-1)];}

/* leaf drawn as vertical spans along an axis */
function leaf(g,x0,y0,ang,len,wid,cm,ce,cl){
  var ax=Math.cos(ang),ay=Math.sin(ang);
  for(var s=0;s<len;s++){
    var t=s/len,w=wid*Math.sin(Math.PI*Math.pow(t,0.65));
    if(w<0.5)w=0.5;
    var cx=x0+ax*s, cy=y0+ay*s;
    var h=Math.round(w*2);
    if(h<1)h=1;
    rect(g,cx,cy-w,1,h,cm);
    px(g,cx,cy-w,ce);px(g,cx,cy-w+h-1,ce);
    if(cl&&s%3===0)px(g,cx,cy,cl);
  }
}

/* ================= WINDOW GEOMETRY ================= */
var WIN={cx:108,cy:92,r:52,top:40,bot:162,x0:56,x1:160};
var SKW=104,SKH=122;
function winHalf(y){ if(y<WIN.cy){var v=WIN.r*WIN.r-(WIN.cy-y)*(WIN.cy-y); return v<0?-1:Math.floor(Math.sqrt(v));} return WIN.r; }

/* ================= SKY BAKE ================= */
var SKG=mk(SKW,SKH), SG=SKG.g;
var SKF=mk(SKW,SKH), SF=SKF.g;
var SKYRAMP=['#05081a','#080c22','#0c122e','#111a3c','#17244c','#1e2e5e','#273a70'];
function bakeSky(){
  for(var y=0;y<SKH;y++){
    var t=Math.min(1,y/92), f=t*(SKYRAMP.length-1), i=Math.floor(f), fr=f-i;
    for(var x=0;x<SKW;x++){
      px(SG,x,y, bay(x,y)<fr?SKYRAMP[Math.min(i+1,6)]:SKYRAMP[i]);
    }
  }
}
function conifer(g,x,base,h,c1,c2){
  var w=Math.max(2,Math.round(h*0.34));
  for(var i=0;i<h;i++){
    var t=i/h, ww=Math.round(w*(1-t)+0.6);
    var y=base-i;
    rect(g,x-ww,y,ww*2+1,1,(i%5===0)?c2:c1);
  }
  rect(g,x,base,1,3,c1);
}
function bakeFar(){
  var x,y;
  for(x=0;x<SKW;x++){
    var h=Math.floor(62+Math.sin(x*0.08)*7+Math.sin(x*0.21+1.3)*3);
    for(y=h;y<SKH;y++)px(SF,x,y,'#131c40');
    px(SF,x,h,'#20305f');px(SF,x,h+1,'#1a2550');
  }
  for(x=0;x<SKW;x++){
    var h2=Math.floor(76+Math.sin(x*0.12+2.2)*4+Math.sin(x*0.31)*2);
    for(y=h2;y<SKH;y++)px(SF,x,y,'#0b1230');
  }
  for(var i=0;i<20;i++){
    var tx=ri(0,SKW), tb=ri(74,84), th=ri(7,17);
    conifer(SF,tx,tb,th,'#070c22','#0a1130');
  }
  for(x=0;x<SKW;x++){
    var h3=Math.floor(88+Math.sin(x*0.17+0.8)*2);
    for(y=h3;y<SKH;y++)px(SF,x,y,'#060a1c');
  }
  dith(SF,0,90,SKW,10,'#060a1c','#0a1026',0.35);
  /* distant cottage */
  rect(SF,66,74,13,9,'#05081a');
  rect(SF,65,71,15,4,'#05081a');
  for(i=0;i<7;i++)px(SF,66+i*2,73,'#0a1026');
  /* a few near conifers in front of cottage */
  conifer(SF,58,90,14,'#04081a','#060c22');
  conifer(SF,88,92,16,'#04081a','#060c22');
  conifer(SF,20,91,13,'#04081a','#060c22');
}

/* ================= INTERIOR BAKE ================= */
var bottles=[];      // shelf bottles, for random flashes
var shelfTop=[62,108,154];

function woodPlankWall(){
  rect(B,0,0,W,24,'#120e10');
  for(var i=-1;i<5;i++){var x=i*118+10;rect(B,x,0,22,24,'#241a18');vl(B,x,0,24,'#31241f');vl(B,x+21,0,24,'#150f0e');}
  rect(B,0,17,W,6,'#2c1f1b');hl(B,0,17,W,'#3c2a23');rect(B,0,23,W,3,'#120c0c');
  var shades=['#3a2a26','#342521','#3f2e28','#2f2320','#372822'];
  for(var x2=0;x2<W;x2+=24){
    var s=shades[(x2/24)%5];
    rect(B,x2,26,24,192,s);
    vl(B,x2,26,192,'#241a17');vl(B,x2+23,26,192,'#452f28');
    for(var k=0;k<6;k++){
      var gx=x2+2+ri(0,19),gy=26+ri(0,160),gl=ri(6,42);
      rect(B,gx,gy,1,gl,(k%2)?'#2b1f1c':'#46332b');
    }
  }
  dith(B,0,26,W,26,'#241a17','#332521',0.55);
  dith(B,0,26,W,12,'#1b1312','#2b201d',0.5);
  dith(B,0,52,W,14,'#2a1f1b','#382823',0.5);
  dith(B,0,186,W,32,'#181012','#33251f',0.5);
  /* baseboard */
  rect(B,0,210,W,8,'#241812');hl(B,0,210,W,'#3d2a1f');rect(B,0,217,W,2,'#0f0a09');
}

function windowBake(){
  /* punch opening */
  for(var y=WIN.top;y<=WIN.bot;y++){
    var h=winHalf(y); if(h<0)continue;
    B.clearRect(WIN.cx-h,y,h*2+1,1);
  }
  /* frame */
  for(var y2=WIN.top-9;y2<=WIN.bot+2;y2++){
    var inn=winHalf(y2);
    var v=(WIN.r+9)*(WIN.r+9)-(WIN.cy-y2)*(WIN.cy-y2);
    var out=(y2<WIN.cy)?(v<0?-1:Math.floor(Math.sqrt(v))):WIN.r+9;
    if(out<0)continue;
    for(var d=-out;d<=out;d++){
      if(inn>=0&&Math.abs(d)<=inn&&y2>=WIN.top&&y2<=WIN.bot)continue;
      var x=WIN.cx+d;
      var edge=(Math.abs(d)>out-2)||(inn>=0&&Math.abs(d)<inn+2);
      px(B,x,y2,edge?'#2a1a12':((d+y2)%7===0?'#5c3d29':'#4a3222'));
    }
  }
  /* sill */
  rect(B,42,162,132,6,'#5c3d29');hl(B,42,162,132,'#7a5336');rect(B,42,168,132,4,'#2a1a12');
  dith(B,42,172,132,5,'#00000000','#1a1010',0.5);
  /* mullions */
  rect(B,105,42,4,120,'#4a3222');vl(B,105,42,120,'#5c3d29');vl(B,108,42,120,'#2a1a12');
  [96,130].forEach(function(y3){
    var h2=winHalf(y3);
    rect(B,WIN.cx-h2,y3,h2*2+1,3,'#4a3222');
    hl(B,WIN.cx-h2,y3,h2*2+1,'#5c3d29');
    hl(B,WIN.cx-h2,y3+2,h2*2+1,'#2a1a12');
  });
  /* small curtain rag top-left of window */
  for(var i=0;i<12;i++){
    rect(B,40+i,30+i*0.3,3,ri(10,22),'#4a2b3a');
  }
}

/* --- object helpers --- */
function bottleDraw(g,x,base,w,h,liq,liqD,glass,corkC,neck){
  var bw=w,bx=x;
  rect(g,bx,base-h,bw,h,glass);
  rect(g,bx,base-h,1,h,'#0e1a1c');rect(g,bx+bw-1,base-h,1,h,'#0e1a1c');
  hl(g,bx,base-1,bw,'#0e1a1c');
  var lh=Math.round(h*0.55);
  rect(g,bx+1,base-lh,bw-2,lh-1,liq);
  hl(g,bx+1,base-lh,bw-2,liqD);
  vl(g,bx+1,base-h+2,h-4,'#b9e6ee');
  if(neck){
    var nx=bx+Math.floor(bw/2)-1;
    rect(g,nx,base-h-4,3,4,glass);
    rect(g,nx-1,base-h-7,5,3,corkC||'#7a5a34');
  }
}
function bookDraw(g,x,base,w,h,c1,c2){
  rect(g,x,base-h,w,h,c1);
  vl(g,x,base-h,h,c2);vl(g,x+w-1,base-h,h,'#00000033');
  hl(g,x,base-h,w,c2);
  for(var i=0;i<2;i++)hl(g,x+1,base-h+3+i*2,w-2,c2);
}
function jarDraw(g,x,base,w,h,liq,body){
  rect(g,x,base-h,w,h,body);
  rect(g,x+1,base-h+3,w-2,h-4,liq);
  rect(g,x-1,base-h-3,w+2,3,'#6a4a2c');
  vl(g,x+1,base-h+4,h-6,'#cfeef5');
  hl(g,x,base-1,w,'#0e1a1c');
}
function potDraw(g,x,base,w,h,c1,c2){
  rect(g,x,base-h,w,h,c1);
  rect(g,x-1,base-h-3,w+2,3,c2);
  hl(g,x,base-h+3,w,c2);
}
function mushroom(g,x,base,sc,cap,cap2,stem){
  var r=Math.round(2*sc);
  rect(g,x,base-Math.round(4*sc),Math.max(1,Math.round(sc)),Math.round(4*sc),stem);
  ell(g,x,base-Math.round(4*sc),r+1,r,cap);
  hl(g,x-r,base-Math.round(4*sc)-r+1,1,cap2);
  px(g,x-1,base-Math.round(4*sc)-1,cap2);px(g,x+1,base-Math.round(4*sc),cap2);
}

function shelvesBake(){
  rect(B,294,24,182,154,'#2b1f1b');
  for(var x=294;x<476;x+=18){vl(B,x,24,154,'#221815');vl(B,x+1,24,154,'#33251f');}
  dith(B,294,24,182,30,'#120d0d','#2b1f1b',0.5);
  rect(B,294,24,3,154,'#1a1210');rect(B,473,24,3,154,'#1a1210');
  shelfTop.forEach(function(y,idx){
    rect(B,296,y,178,4,'#573a27');hl(B,296,y,178,'#7a5336');rect(B,296,y+4,178,3,'#1d1411');
    for(var bx=302;bx<470;bx+=38){rect(B,bx,y+4,3,7,'#3b2719');}
  });
  /* --- board 1 (y=62) --- */
  bookDraw(B,300,62,5,22,'#6b2f36','#8f4a4a');
  bookDraw(B,305,62,4,19,'#2f4f6b','#4a7a9a');
  bookDraw(B,309,62,6,23,'#4a6b2f','#78a04a');
  bookDraw(B,315,62,4,17,'#6b542f','#a0864a');
  rect(B,322,54,16,8,'#5a3f28');rect(B,322,52,16,2,'#7a5336');
  addBottle(344,62,7,18,'#3f8f6a','#66c99a','#2c4a4e',true);
  addBottle(353,62,6,14,'#8f5fbf','#c39aef','#2c4a4e',true);
  addBottle(361,62,8,21,'#bf7f3f','#efc07a','#2c4a4e',true);
  /* skull */
  ell(B,378,54,7,6,'#cfc6ae');rect(B,373,55,10,6,'#cfc6ae');
  rect(B,374,52,3,3,'#2a2420');rect(B,380,52,3,3,'#2a2420');
  rect(B,377,56,2,2,'#2a2420');
  for(var i=0;i<4;i++)px(B,375+i*2,61,'#2a2420');
  jarDraw(B,392,62,15,20,'#2e5f5a','#3e6b6e');
  potDraw(B,414,62,13,9,'#7a4a2e','#9a6340');
  addBottle(434,62,7,16,'#5f9fbf','#9ad4ef','#2c4a4e',true);
  rect(B,446,54,20,8,'#c9b68e');rect(B,446,54,20,1,'#e6d8b4');rect(B,444,53,3,10,'#8a6a3a');rect(B,465,53,3,10,'#8a6a3a');
  /* --- board 2 (y=108) --- */
  bookDraw(B,300,108,17,5,'#3f4f6b','#6a83a8');
  bookDraw(B,301,103,15,4,'#6b3f4f','#a86a83');
  addBottle(322,108,6,15,'#bf3f5f','#ef7a95','#2c4a4e',true);
  addBottle(330,108,8,20,'#3fbfa0','#8affd9','#2c4a4e',true);
  addBottle(340,108,5,12,'#bfbf3f','#efef8a','#2c4a4e',true);
  potDraw(B,350,108,16,10,'#6a4030','#8a5a44');
  jarDraw(B,374,108,17,24,'#2a4a6a','#3a5a7a');
  rect(B,396,88,22,20,'#3a2a1e');rect(B,396,88,22,2,'#5a4230');
  for(var j=0;j<6;j++)vl(B,398+j*3,90,18,'#5a4230');
  addBottle(424,108,7,17,'#7f4fbf','#bb9aef','#2c4a4e',true);
  bookDraw(B,436,108,6,20,'#2f6b5a','#4a9a86');
  bookDraw(B,442,108,5,22,'#6b4a2f','#a07a4a');
  bookDraw(B,447,108,6,18,'#43306b','#7a63a8');
  rect(B,458,101,12,7,'#6a5a3a');rect(B,457,99,14,3,'#8a7a52');
  /* --- board 3 (y=154) --- */
  jarDraw(B,300,154,20,28,'#3a5f3a','#4a6f4f');
  jarDraw(B,324,154,16,22,'#5f3a5f','#6f4a6f');
  rect(B,344,138,26,16,'#4a3a2a');rect(B,344,136,26,3,'#6a5340');
  for(var s=0;s<4;s++)rect(B,346+s*6,140,4,12,'#c9b68e');
  rect(B,376,140,20,14,'#5a6a72');rect(B,373,143,4,3,'#5a6a72');rect(B,394,136,7,6,'#5a6a72');
  hl(B,376,140,20,'#7e909a');
  bookDraw(B,406,154,20,6,'#6b5a2f','#a08c4a');
  bookDraw(B,407,148,18,5,'#2f5a6b','#4a86a0');
  rect(B,432,146,4,8,'#8a8a92');rect(B,436,150,8,2,'#8a8a92');
  rect(B,448,144,10,10,'#6a4a2e');rect(B,452,138,2,6,'#8a6a3a');
  rect(B,462,148,8,6,'#3a4a3a');
}
function addBottle(x,base,w,h,liq,liqD,glass,neck){
  bottleDraw(B,x,base,w,h,liq,liqD,glass,'#7a5a34',neck);
  bottles.push({x:x+w/2,y:base-h/2,c:liqD});
}

function benchBake(){
  var bx=136,bw=228,ty=174;

  rect(B,142,ty+6,10,40,'#3b2718');rect(B,142,ty+6,3,40,'#513520');

  /* book stand */

  /* small tools */
  rect(B,290,171,5,3,'#8a8a92');rect(B,294,172,6,1,'#8a8a92');
}

function floorBake(){
  rect(B,0,218,W,52,'#3a2718');
  var y=218,hh=6,row=0;
  while(y<H){
    var c=(row%2)?'#402c1b':'#372615';
    rect(B,0,y,W,hh,c);
    hl(B,0,y,W,'#4d351f');
    hl(B,0,y+hh-1,W,'#241708');
    for(var x=(row%2?0:26);x<W;x+=72){vl(B,x,y,hh,'#241708');}
    for(var k=0;k<10;k++){var gx=ri(0,W),gy=y+ri(0,hh-1);px(B,gx,gy,(k%2)?'#2e1f12':'#54391f');}
    y+=hh;hh+=2;row++;
  }
  /* rug */
  var rx=168,ry=234,rw=150,rh=32;
  ell(B,rx+rw/2,ry+rh/2,rw/2,rh/2,'#6e2f3a');
  ell(B,rx+rw/2,ry+rh/2,rw/2-3,rh/2-2,'#93414f');
  ell(B,rx+rw/2,ry+rh/2,rw/2-7,rh/2-5,'#70303c');

function flame(g,x,y,scale,phase,warm){
  var f=n1(T*7+phase);
  var hgt=Math.round((5+f*1.8)*scale);
  var w=Math.max(1,Math.round(1.6*scale));
  var sway=Math.round(n1(T*4+phase)*scale);
  for(var i=0;i<hgt;i++){
    var t=i/hgt;
    var ww=Math.max(0,Math.round(w*(1-t*t)*1.5));
    var xx=x+sway*t;
    var c= t<0.25?'#ff8b2c': t<0.55?'#ffb347':'#ffe9a8';
    rect(g,xx-ww,y-i,ww*2+1,1,c);
  }
  rect(g,x-Math.max(0,w-1),y-Math.round(hgt*0.45),Math.max(1,(w-1)*2+1),Math.round(hgt*0.35),'#fff6d8');
  px(g,x,y-hgt-1,'rgba(255,230,180,0.5)');
  return hgt;
}

  for(var k=0;k<5;k++){
    var t=k/5, sw2=Math.sin(T*0.8+phase)*1.6*t;

    px(g,x+sw2+wid*(1-t)+1,y+t*len+2,c2);

}

var BEAM={ax:56,ay:150,bx:160,by:40,dx:0.55,dy:0.83};
function beamAt(y){
  var t1=(y-BEAM.ay)/BEAM.dy, t2=(y-BEAM.by)/BEAM.dy;
  return [BEAM.ax+BEAM.dx*t1, BEAM.bx+BEAM.dx*t2];
}
function beamContains(x,y){
  if(y<40||y>224)return false;
  var e=beamAt(y);
  return x>e[0]&&x<e[1];
}
function drawBeam(g){

  fgMush(g,16,268,1.5,gp,2.2);
  leaf(g,488,270,-2.32+s1,74,13,'#102419','#1a3626','#244a32');
  leaf(g,480,272,-1.92+s2,58,10,'#0b1912','#132619',null);
  leaf(g,488,236,-3.0+s1*1.2,48,9,'#0a1710','#112118',null);
  /* top corners darkening */
  for(var dy2=0;dy2<12;dy2++)rect(g,0,dy2,W,1,'rgba(4,6,12,'+(0.55-dy2*0.045)+')');
  for(var dy3=0;dy3<10;dy3++)rect(g,0,H-1-dy3,W,1,'rgba(4,6,12,'+(0.5-dy3*0.05)+')');
}
function fgMush(g,x,base,sc,gp,ph){
  var stemH=Math.round(10*sc);
  var sway=Math.sin(T*0.5+ph)*0.8;
  var sw=Math.round(2*sc*0.5);
  for(var i=0;i<stemH;i++){
    var t=i/stemH, xx=x+sway*t;
    var w=Math.max(1,Math.round(sw*(0.7+t*0.5)));
    rect(g,xx-w,base-i,w*2+1,1,'#101a20');
    px(g,xx-w,base-i,'#16242c');
  }
  var cx=x+sway, cy=base-stemH, r=Math.round(4.2*sc);
  /* cap */
  for(var dy=0;dy>=-r;dy--){
    var t2=-dy/r, d=Math.round(r*Math.sqrt(Math.max(0,1-t2*t2*0.55)));
    rect(g,cx-d,cy+dy,d*2+1,1,'#132029');
    px(g,cx-d,cy+dy,'#1c2e38');px(g,cx+d,cy+dy,'#0d171d');
  }
  var glow=0.4+0.35*Math.sin(T*1.3+ph);
  /* glowing gills under the cap */
  for(var k=-r+1;k<r;k++){
    if((k+99)%2)continue;
    px(g,cx+k,cy+1,'rgba(120,225,255,'+(glow*0.85)+')');
    if(Math.abs(k)<r*0.6)px(g,cx+k,cy+2,'rgba(90,190,235,'+(glow*0.4)+')');
  }
  /* speckles on the cap */
  for(var m=0;m<4;m++){
    var a=ph*2+m*1.7;
    px(g,cx+Math.cos(a)*r*0.5,cy-r*0.45+Math.sin(a)*r*0.25,'rgba(150,235,255,'+(glow*0.7)+')');
  }
  if(Math.random()<0.02)spores.push({x:cx,y:cy+1,vx:(Math.random()-0.5)*4,vy:-4-Math.random()*4,l:1,c:[140,225,255]});
}
function drawRune(g){
  if(E.rune.t<=0)return;
  var a=Math.sin(Math.min(1,E.rune.t)*Math.PI);
  var col='rgba(190,150,255,'+(a*0.85)+')';
  ringd(g,RUNE.x,RUNE.y,RUNE.r,col);
  ringd(g,RUNE.x,RUNE.y,RUNE.r-4,'rgba(210,180,255,'+(a*0.55)+')');
  var rot=T*0.5;
  for(var i=0;i<12;i++){
    var ang=rot+i*Math.PI/6;
    var x=RUNE.x+Math.cos(ang)*(RUNE.r-9),y=RUNE.y+Math.sin(ang)*(RUNE.r-9);
    rect(g,x,y-2,1,4,col);rect(g,x-1,y+((i%2)?1:-1),3,1,col);
  }
  for(var b=0;b<3;b++){
    var a1=rot*0.5+b*2.09,a2=a1+2.09*2;
    lineTo(g,RUNE.x+Math.cos(a1)*(RUNE.r-1),RUNE.y+Math.sin(a1)*(RUNE.r-1),RUNE.x+Math.cos(a2)*(RUNE.r-1),RUNE.y+Math.sin(a2)*(RUNE.r-1),'rgba(200,165,255,'+(a*0.4)+')');
  }
}
function drawSpirit(g){
  var s=E.spirit;
  if(s.t<=0)return null;
  s.life+=DT;
  s.x+=s.vx*DT+Math.sin(T*2.1)*0.5;
  s.y+=s.vy*DT;
  s.vy*=0.992;
  var a=Math.min(1,s.life*1.6)*Math.max(0,1-Math.max(0,s.life-3.4)/1.6);
  if(s.life>5.2){s.t=0;return null;}
  for(var i=0;i<7;i++){
    var t=i/7;
    var tx=s.x-s.vx*t*0.16+Math.sin(T*2.2-t*2)*2;
    var ty=s.y-s.vy*t*0.16+t*4;
    circ(g,tx,ty,Math.max(0,2-t*2),'rgba(170,240,230,'+(a*(0.5-t*0.45))+')');
  }
  circ(g,s.x,s.y,2,'rgba(200,255,245,'+(a*0.8)+')');
  px(g,s.x,s.y,'rgba(255,255,255,'+a+')');
  /* eyes */
  px(g,s.x-1,s.y-1,'rgba(40,90,90,'+(a*0.8)+')');px(g,s.x+1,s.y-1,'rgba(40,90,90,'+(a*0.8)+')');
  /* cat notices */
  if(s.life>0.4&&s.life<0.6&&Math.abs(s.x-390)<110&&E.catLook.t<=0)E.catLook.t=1;
  return {x:s.x,y:s.y,a:a};
}

/* ================= LIGHTING ================= */
function addGlow(x,y,r,col,inten){
  var gr=G.createRadialGradient(x,y,0,x,y,r);
  gr.addColorStop(0,'rgba('+col[0]+','+col[1]+','+col[2]+','+inten+')');
  gr.addColorStop(0.45,'rgba('+col[0]+','+col[1]+','+col[2]+','+(inten*0.32)+')');
  gr.addColorStop(1,'rgba('+col[0]+','+col[1]+','+col[2]+',0)');
  G.fillStyle=gr;
  G.fillRect(x-r,y-r,r*2,r*2);
}
function lighting(core,moth,spirit){
  G.globalCompositeOperation='source-over';
  G.fillStyle='#000';G.fillRect(0,0,W,H);
  G.globalCompositeOperation='lighter';
  var fk=0.82+0.18*n1(T*7);
  /* candles */
  addGlow(146,161,58*fk,[255,168,72],1.05);
  addGlow(352,159,60*fk,[255,175,80],1.1);
  addGlow(183,163,58*fk,[255,150,70],1.0);
  addGlow(250,186,150,[255,152,86],0.26);
  addGlow(183,96,58*fk,[255,180,90],1.0);
  addGlow(287,84,46*fk,[255,172,84],0.85);
  /* lantern */
  addGlow(moth.lx,moth.ly,72*(0.9+0.1*n1(T*5+2)),[255,186,104],1.05);
  /* hearth-ish warm pool on the floor */
  addGlow(250,220,100,[255,150,80],0.26);
  /* moon through window */
  addGlow(88,68,86,[130,170,255],0.62);
  addGlow(108,120,70,[110,150,240],0.34);
  addGlow(150,215,74,[110,150,240],0.18);
  /* magic plant */
  addGlow(core.x,core.y,60+core.pulse*22,core.c,0.80+core.pulse*0.35);
  addGlow(core.x,core.y+26,42,core.c,0.26);
  /* alembic + jars */
  addGlow(209,158,20,[170,110,240],0.45);
  addGlow(399,50,16,[110,220,200],0.35);
  addGlow(407,98,14,[150,210,255],0.45);
  addGlow(353,96,18,[220,130,200],0.30);
  /* foreground mushrooms */
  var gp=0.5+0.5*Math.sin(T*1.1);
  addGlow(452,238,40,[110,200,255],0.34+gp*0.26);
  addGlow(468,238,26,[110,200,255],0.18+gp*0.16);
  addGlow(16,252,22,[110,200,255],0.16+gp*0.14);
  addGlow(396,206,54,[255,168,96],0.30);
  /* basin reflection */
  addGlow(118,204,26,[120,180,255],0.3);
  /* rune */
  if(E.rune.t>0)addGlow(RUNE.x,RUNE.y,46,[180,140,255],Math.sin(Math.min(1,E.rune.t)*Math.PI)*0.8);
  /* bottle flash */
  if(E.flash.t>0){
    var b=bottles[E.flash.i];
    var a=Math.sin(Math.min(1,E.flash.t)*Math.PI);
    var cc=b.c;
    var col=hexToRgb(cc);
    addGlow(b.x,b.y,20+a*34,col,a*1.2);
  }
  /* spirit */
  if(spirit)addGlow(spirit.x,spirit.y,30,[150,255,230],spirit.a*0.8);
  /* spores as light */
  for(var i=0;i<spores.length;i+=3){
    var p=spores[i];
    if(p.l>0.4)addGlow(p.x,p.y,7,p.c,p.l*0.5);
  }
  /* glow bugs */
  for(i=0;i<bugs.length;i++){
    var bg2=bugs[i];var gg=0.45+0.55*Math.sin(T*2.3+bg2.p);
    if(gg>0.2)addGlow(bg2.x,bg2.y,12,bg2.c,gg*0.45);
  }
  /* ambient + glow -> lightmap */
  L.globalCompositeOperation='source-over';
  L.fillStyle='rgb(92,94,122)';
  L.fillRect(0,0,W,H);
  /* cool wash near window wall, warmer near bench */
  var lg=L.createLinearGradient(0,0,W,0);
  lg.addColorStop(0,'rgba(70,86,140,0.55)');
  lg.addColorStop(0.45,'rgba(0,0,0,0)');
  lg.addColorStop(1,'rgba(90,70,60,0.35)');
  L.globalCompositeOperation='lighter';
  L.fillStyle=lg;L.fillRect(0,0,W,H);
  L.drawImage(GL.c,0,0);
  /* apply */
  S.globalCompositeOperation='multiply';
  S.drawImage(LT.c,0,0);
  S.globalCompositeOperation='lighter';
  S.globalAlpha=0.26;
  S.drawImage(GL.c,0,0);
  S.globalAlpha=1;
  S.globalCompositeOperation='source-over';
}
function hexToRgb(h){
  var v=parseInt(h.slice(1),16);
  return [(v>>16)&255,(v>>8)&255,v&255];
}
function vignette(){
  S.globalCompositeOperation='multiply';
  var g2=S.createRadialGradient(W/2,H/2,90,W/2,H/2,300);
  g2.addColorStop(0,'rgba(255,255,255,1)');
  g2.addColorStop(1,'rgba(120,120,150,1)');
  S.fillStyle=g2;S.fillRect(0,0,W,H);
  S.globalCompositeOperation='source-over';
}

/* ================= FRAME ================= */
var DT=1/30;
function frame(dt){
  DT=dt;T+=dt;
  tickEvents(dt);
  /* decay event timers */
  ['flash','rune','bloom','tail','catLook','page','sporeBurst'].forEach(function(k){
    if(E[k].t>0)E[k].t-=dt*({flash:1.6,rune:0.24,bloom:0.22,tail:0.55,catLook:0.26,page:1.25,sporeBurst:1}[k]);
  });
  if(flask.surge>0)flask.surge-=dt*0.35;

  S.globalCompositeOperation='source-over';
  S.fillStyle='#05070d';S.fillRect(0,0,W,H);
  drawExterior();
  S.drawImage(BG.c,0,0);

  drawRune(S);
  drawShelfDynamics(S);
  var lantern=drawLantern(S);
  drawCandles(S);
  drawFlask(S);
  drawAlembic(S);
  bookPage(S);
  var core=terrarium(S);
  drawBasin(S);
  catDraw(S);
  var spirit=drawSpirit(S);
  drawParticles(S);
  drawForeground(S);
  lighting(core,{lx:420,ly:48},spirit);
  drawBeam(S);
  vignette();

  VX.drawImage(SC.c,0,0);
}

bakeAll();

var last=performance.now(),acc=0;
function loop(now){
  requestAnimationFrame(loop);
  var dt=(now-last)/1000;last=now;
  if(dt>0.25)dt=0.25;
  acc+=dt;
  if(acc<1/31)return;
  frame(Math.min(acc,0.1));
  acc=0;
}
requestAnimationFrame(loop);
})();
</script>
